# manga-utils build Maven mirror — run on MAIN (clean egress). Worker nodes point their Gradle build here
# over the tailnet so deps don't get fetched through the Mullvad exit (which Google's Maven CDN blocks).
#
#   On main:   docker compose -f deploy/maven-mirror/docker-compose.yml up -d
#   On a worker, before building:   export MU_MAVEN_MIRROR=http://<main-tailnet-ip>:8099
#
# See docs/maven-mirror.md for the full flow.

services:
  maven-mirror:
    image: nginx:1.27-alpine
    container_name: mu-maven-mirror
    ports:
      - "8099:8099"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - mu-maven-cache:/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8099/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mu-maven-cache:
