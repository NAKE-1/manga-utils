worker_processes auto;
events { worker_connections 1024; }

# manga-utils build Maven mirror. A caching reverse proxy for the Gradle build's upstream repos, run on
# MAIN (which has clean internet egress). Worker nodes point their build at http://<main-tailnet>:8099/...
# over the tailnet (which bypasses their Mullvad exit), so a worker never fetches deps from Google's Maven
# CDN directly - which refuses the Mullvad datacenter IP. First fetch is pulled (and cached) via main's
# clean egress; later builds hit the cache. See docs/maven-mirror.md + settings.gradle.kts.

http {
    # Big responses (jars) + long-lived cache: artifacts at a fixed version are immutable.
    proxy_cache_path /cache levels=1:2 keys_zone=maven:50m max_size=20g inactive=120d use_temp_path=off;
    proxy_cache_key          "$scheme$proxy_host$request_uri";
    proxy_cache_valid        200 206 120d;
    proxy_cache_valid        404 1m;
    proxy_ssl_server_name    on;            # SNI - jetbrains/jogamp TLS vhosts need it
    proxy_http_version       1.1;
    proxy_set_header         Connection "";
    proxy_read_timeout       120s;
    proxy_connect_timeout    15s;
    sendfile                 on;

    server {
        listen 8099;
        server_name _;
        add_header X-Cache $upstream_cache_status always;

        location = / { default_type text/plain; return 200 "manga-utils maven mirror\n"; }
        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        # One path per Gradle upstream. The trailing-slash proxy_pass strips the location prefix, so
        # /central/foo/bar -> https://repo.maven.apache.org/maven2/foo/bar, etc.
        location /central/        { proxy_pass https://repo.maven.apache.org/maven2/; proxy_set_header Host repo.maven.apache.org; proxy_cache maven; }
        location /google/         { proxy_pass https://dl.google.com/dl/android/maven2/; proxy_set_header Host dl.google.com; proxy_cache maven; }
        location /gradle-plugins/ { proxy_pass https://plugins.gradle.org/m2/; proxy_set_header Host plugins.gradle.org; proxy_cache maven; }
        location /jitpack/        { proxy_pass https://jitpack.io/; proxy_set_header Host jitpack.io; proxy_cache maven; }
        location /jetbrains-ij/   { proxy_pass https://packages.jetbrains.team/maven/p/ij/intellij-dependencies/; proxy_set_header Host packages.jetbrains.team; proxy_cache maven; }
        location /compose-dev/    { proxy_pass https://maven.pkg.jetbrains.space/public/p/compose/dev/; proxy_set_header Host maven.pkg.jetbrains.space; proxy_cache maven; }
        location /jogamp/         { proxy_pass https://jogamp.org/deployment/maven/; proxy_set_header Host jogamp.org; proxy_cache maven; }
    }
}
