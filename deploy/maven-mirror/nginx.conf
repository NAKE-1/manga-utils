worker_processes auto;
events { worker_connections 1024; }

# manga-utils build Maven mirror. A caching reverse proxy for the Gradle build's upstream repos, run on
# MAIN (which has clean internet egress). Worker nodes point their build at http://<main-tailnet>:8099/...
# over the tailnet (which bypasses their Mullvad exit), so a worker never fetches deps from Google's Maven
# CDN directly - which refuses the Mullvad datacenter IP. First fetch is pulled (and cached) via main's
# clean egress; later builds hit the cache. See docs/maven-mirror.md + settings.gradle.kts.
#
# Upstreams are declared as VARIABLES with a resolver so nginx resolves them lazily at request time - a
# plain `proxy_pass https://host/...` is resolved at startup and nginx refuses to boot if ANY host can't
# be resolved right then (which took the whole mirror down once).

http {
    resolver 127.0.0.11 ipv6=off valid=60s;   # docker's embedded DNS (forwards external lookups)
    resolver_timeout 10s;

    proxy_cache_path /cache levels=1:2 keys_zone=maven:50m max_size=20g inactive=120d use_temp_path=off;
    proxy_cache_key          "$scheme$host$request_uri";
    proxy_cache_valid        200 206 120d;
    proxy_cache_valid        404 1m;
    proxy_ssl_server_name    on;            # SNI
    proxy_http_version       1.1;
    proxy_set_header         Connection "";
    proxy_read_timeout       120s;
    proxy_connect_timeout    15s;
    sendfile                 on;

    server {
        listen 8099;
        server_name _;
        add_header X-Cache $upstream_cache_status always;

        location = / { default_type text/plain; return 200 "manga-utils maven mirror\n"; }
        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        # One path per Gradle upstream. Each sets the host in a var (lazy DNS), rewrites the mirror prefix
        # to the upstream's real base path, and proxies with Host + SNI pinned to that host.
        location /central/ {
            set $u repo.maven.apache.org; rewrite ^/central/(.*)$ /maven2/$1 break;
            proxy_pass https://$u; proxy_ssl_name $u; proxy_set_header Host $u; proxy_cache maven;
        }
        location /google/ {
            set $u dl.google.com; rewrite ^/google/(.*)$ /dl/android/maven2/$1 break;
            proxy_pass https://$u; proxy_ssl_name $u; proxy_set_header Host $u; proxy_cache maven;
        }
        location /gradle-plugins/ {
            set $u plugins.gradle.org; rewrite ^/gradle-plugins/(.*)$ /m2/$1 break;
            proxy_pass https://$u; proxy_ssl_name $u; proxy_set_header Host $u; proxy_cache maven;
        }
        location /jitpack/ {
            set $u jitpack.io; rewrite ^/jitpack/(.*)$ /$1 break;
            proxy_pass https://$u; proxy_ssl_name $u; proxy_set_header Host $u; proxy_cache maven;
        }
        location /jetbrains-ij/ {
            set $u packages.jetbrains.team; rewrite ^/jetbrains-ij/(.*)$ /maven/p/ij/intellij-dependencies/$1 break;
            proxy_pass https://$u; proxy_ssl_name $u; proxy_set_header Host $u; proxy_cache maven;
        }
        location /compose-dev/ {
            set $u maven.pkg.jetbrains.space; rewrite ^/compose-dev/(.*)$ /public/p/compose/dev/$1 break;
            proxy_pass https://$u; proxy_ssl_name $u; proxy_set_header Host $u; proxy_cache maven;
        }
        location /jogamp/ {
            set $u jogamp.org; rewrite ^/jogamp/(.*)$ /deployment/maven/$1 break;
            proxy_pass https://$u; proxy_ssl_name $u; proxy_set_header Host $u; proxy_cache maven;
        }
    }
}
